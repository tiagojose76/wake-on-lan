<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="titulo descricao" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="titulo">Como funciona</title>
  <desc id="descricao">O botão Ligar do app no celular envia um magic packet (Wake-on-LAN) para a placa de rede do PC. Os botões Desligar, Reiniciar e Status enviam um pedido com token para o agente, que roda o comando do Windows e responde online.</desc>
  <defs>
    <marker id="seta-azul" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
    <marker id="seta-verde" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="360" rx="16" fill="#F8FAFC" stroke="#CBD5E1"/>

  <!-- App no celular -->
  <rect x="30" y="45" width="220" height="270" rx="14" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="140" y="80" text-anchor="middle" font-size="17" font-weight="700" fill="#0F172A">App no celular</text>
  <g font-size="15" font-weight="600" fill="#0F172A" text-anchor="middle">
    <rect x="50" y="100" width="160" height="40" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
    <text x="130" y="125">Ligar</text>
    <rect x="50" y="155" width="160" height="40" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <text x="130" y="180">Desligar</text>
    <rect x="50" y="205" width="160" height="40" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <text x="130" y="230">Reiniciar</text>
    <rect x="50" y="255" width="160" height="40" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <text x="130" y="280">Status</text>
  </g>

  <!-- PC (Windows) -->
  <rect x="550" y="45" width="220" height="270" rx="14" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="660" y="80" text-anchor="middle" font-size="17" font-weight="700" fill="#0F172A">PC (Windows)</text>
  <rect x="570" y="96" width="180" height="48" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="660" y="125" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">Placa de rede</text>
  <rect x="570" y="170" width="180" height="120" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="660" y="214" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Agente</text>
  <text x="660" y="238" text-anchor="middle" font-size="13" fill="#334155">(roda o comando</text>
  <text x="660" y="256" text-anchor="middle" font-size="13" fill="#334155">do Windows)</text>

  <!-- Caminho Wake-on-LAN -->
  <line x1="210" y1="120" x2="570" y2="120" stroke="#2563EB" stroke-width="2.5" marker-end="url(#seta-azul)"/>
  <text x="400" y="109" text-anchor="middle" font-size="14" font-weight="600" fill="#1D4ED8">magic packet (Wake-on-LAN)</text>

  <!-- Caminho do agente -->
  <path d="M210,175 H226 M210,225 H226 M210,275 H226 M226,175 V275" fill="none" stroke="#059669" stroke-width="2.5"/>
  <line x1="226" y1="205" x2="570" y2="205" stroke="#059669" stroke-width="2.5" marker-end="url(#seta-verde)"/>
  <text x="400" y="194" text-anchor="middle" font-size="14" font-weight="600" fill="#047857">pedido + token</text>
  <line x1="570" y1="262" x2="250" y2="262" stroke="#059669" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#seta-verde)"/>
  <text x="400" y="251" text-anchor="middle" font-size="14" font-weight="600" fill="#047857">online</text>
</svg>
